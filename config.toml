[network]
ipv4 = "10.76.111.1/24"
ipv6 = "fd42:28e2:2375:7000::1/64"

[server]
hostname = "steven-desktop"
# Trusted private-network console: skip bootstrap/session auth and the browser
# write boundary. Set true to require both layers.
require_session = false

[base_image]
name = "sandbox"
source = "https://images.linuxcontainers.org"
image = "debian/13"
authorized_hosts = [
    "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINmUKR1hA7Ry2zntw2qxEiJJvcjLaFptB/Rci+SJzsnA sklarsa@gmail.com"
]

[workspace]
repos = [
    "questdb/questdb",
    "questdb/questdb-enterprise",
    "questdb/questdb-enterprise-operator",
    "questdb/byoc",
    "questdb/byoc-prod",
    "questdb/azure-ci-runners",
    "questdb/benchmark-runner",
    "questdb/c-questdb-client",
    "questdb/distribution",
    "questdb/go-questdb-client",
    "questdb/java-questdb-client",
    "questdb/net-questdb-client",
    "questdb/nodejs-questdb-client",
    "questdb/py-questdb-client",
    "questdb/tsbs",
    "questdb/zfs-builds",
    "sklarsa/incus-azure-pipelines",
    "sklarsa/kanedias-testing",
    "sklarsa/kanedias"
]

[workers.researcher]
description = "Research external sources and return evidence without modifying files."
provider = "openai-codex"
model = "gpt-5.6-sol"
thinking_level = "high"

[workers.reviewer]
description = "Review code and designs without modifying files."
provider = "openai-codex"
model = "gpt-5.6-sol"
thinking_level = "xhigh"

[workers.worker]
description = "Implement changes and hand off pushed Git refs."
provider = "openai-codex"
model = "gpt-5.6-sol"
thinking_level = "high"
