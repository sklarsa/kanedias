{{define "session-modal.html"}}
<dialog id="new-session-modal" aria-labelledby="new-session-title" aria-describedby="new-session-help">
  <form id="new-session-form">
    <div class="modal-header">
      <h2 id="new-session-title">New session</h2>
      <button type="button" class="icon-btn modal-close" data-modal-close aria-label="Close"{{if not .Enabled}} disabled{{end}}>×</button>
    </div>
    <p id="new-session-help">Choose the root model profile and defaults for every subagent role.</p>

    <fieldset{{if not .Enabled}} disabled{{end}}>
      <legend>Session details</legend>
      <label for="session-name">Session name <span class="optional">optional</span></label>
      <input id="session-name" type="text" maxlength="80" autocomplete="off" data-session-name>
      <label for="start-repository">Starting repository</label>
      <select id="start-repository" data-start-repository>
        <option value="" selected>/workspace</option>
        {{range .Repositories}}<option value="{{.Slug}}">{{.Slug}}</option>{{end}}
      </select>
    </fieldset>

    <fieldset{{if not .Enabled}} disabled{{end}}>
      <legend>Root model profile</legend>
      <label for="root-model">Model</label>
      <select id="root-model" name="root-model" data-root-model>
        {{range .RootModels}}<option value="{{.ID}}"{{if .Selected}} selected{{end}} data-thinking-levels="{{.ThinkingLevelsCSV}}" data-default-thinking="{{.DefaultThinkingLevel}}">{{.Label}}</option>{{end}}
      </select>
      <label for="root-thinking">Thinking level</label>
      <select id="root-thinking" name="root-thinking" data-root-thinking>
        {{range .RootThinking}}<option value="{{.Level}}"{{if .Selected}} selected{{end}}>{{.Level}}</option>{{end}}
      </select>
    </fieldset>

    <details>
      <summary>Subagent model profiles</summary>
      {{range .Workers}}
      <fieldset class="worker-model-profile" data-worker-row data-worker-type="{{.Role}}"{{if not $.Enabled}} disabled{{end}}>
        <legend>{{.Role}}</legend>
        <p>{{.Description}}</p>
        <label for="worker-model-{{.Index}}">Model</label>
        <select id="worker-model-{{.Index}}" name="worker-model-{{.Index}}" data-worker-model>
          {{range .Models}}<option value="{{.ID}}"{{if .Selected}} selected{{end}} data-thinking-levels="{{.ThinkingLevelsCSV}}" data-default-thinking="{{.DefaultThinkingLevel}}">{{.Label}}</option>{{end}}
        </select>
        <label for="worker-thinking-{{.Index}}">Thinking level</label>
        <select id="worker-thinking-{{.Index}}" name="worker-thinking-{{.Index}}" data-worker-thinking>
          {{range .Thinking}}<option value="{{.Level}}"{{if .Selected}} selected{{end}}>{{.Level}}</option>{{end}}
        </select>
      </fieldset>
      {{end}}
    </details>

    <div id="new-session-status" role="status" aria-live="polite"></div>
    <div class="modal-actions">
      <button type="button" id="new-session-cancel"{{if not .Enabled}} disabled{{end}}>Cancel</button>
      <button type="submit" id="new-session-launch"{{if not .Enabled}} disabled{{end}}>Launch</button>
    </div>
  </form>
</dialog>
{{end}}
