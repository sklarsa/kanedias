{{define "index.html"}}<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Kanedias — Circle of the Fleet</title>
  <link rel="stylesheet" href="/assets/terminal.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/datastar.js"></script>
</head>
<body data-signals='{"selectedSessionId":"","commandMessage":""}' data-init="@get('/ui/fleet')">
<div class="app">

  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open fleet tree" aria-expanded="false">☰</button>
    <div class="brandmark" aria-hidden="true"></div>
    <div class="brand-txt">
      <span class="t1">Kanedias</span>
      <span class="t2">Circle of the Fleet</span>
    </div>
    <div class="topbar-spacer"></div>
    <button class="alert-banner" id="alertBanner" title="Jump to agents awaiting the Maker">
      <span class="diamond">◇</span>
      <span class="count" id="alertCount">0</span>
      <span class="label-long">Questions await the Maker</span>
    </button>
  </header>

  <!-- Stable Datastar patch roots -->
  <div id="fleet-panel"></div>
  <div id="main-stack">
    <div id="detail-panel" data-can-steer="false" data-can-interrupt="false" data-can-stop="false"></div>
    <div id="question-panel"></div>
    <div id="activity-panel"></div>
    <div id="deck-status" role="status"></div>
  </div>

  <!-- ===================== COMMAND DECK ===================== -->
  <footer class="deck">
    <span class="deck-lbl">alidade ›</span>
    <input class="deck-input" type="text" placeholder="steer — type a directive…" aria-label="Command input"
      aria-keyshortcuts="Control+A Control+C Enter" title="Ctrl+A: home · Ctrl+C: clear or copy · Enter: steer"
      data-bind="commandMessage">
    <span class="deck-hint" aria-hidden="true">^A home · ^C clear/copy · esc abort · ^O tools</span>
    <button class="dbtn steer" id="steerBtn"
      data-on:click="@post('/ui/sessions/'+$selectedSessionId+'/steer', {payload:{message:$commandMessage}})">
      <span class="g">→</span> Steer
    </button>
    <button class="dbtn interrupt" id="interruptBtn" aria-keyshortcuts="Escape" title="Escape: interrupt current turn"
      data-on:click="@post('/ui/sessions/'+$selectedSessionId+'/interrupt', {payload:{}})">
      <span class="g">◇</span> Interrupt Turn <kbd class="shortcut-key" aria-hidden="true">ESC</kbd>
    </button>
    <button class="dbtn stop"
      data-on:click="@post('/ui/sessions/'+$selectedSessionId+'/stop', {payload:{}})">
      <span class="g">▣</span> Stop Session
    </button>
    <button class="dbtn new-session"
      data-on:click="@post('/ui/sessions', {payload:{}})">
      <span class="g">＋</span> New Session
    </button>
  </footer>

</div>

<div class="scrim" id="scrim"></div>

<script src="/assets/marked.min.js"></script>
<script src="/assets/highlight.min.js"></script>
<script src="/assets/markdown-renderer.js"></script>
<script src="/assets/terminal-ui.js"></script>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
{{end}}
