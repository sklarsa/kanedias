name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # Hermetic suite only. The //go:build incus live/E2E tests need a real
      # Incus daemon and are not run here — see #4 for wiring them into a
      # self-hosted runner.
      #
      # A couple of timing/socket-sensitive tests flake on shared CI runners
      # while passing deterministically in isolation. Retry the suite a few
      # times so transient flakes don't block merges; a real regression fails
      # every attempt. Tracked by #6.
      - name: Test
        run: |
          for attempt in 1 2 3; do
            echo "::group::test attempt $attempt"
            if make test; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "test attempt $attempt failed"
          done
          echo "test failed after 3 attempts"
          exit 1

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
