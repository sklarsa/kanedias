name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    name: Build, Test and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      # Hermetic suite only. The //go:build incus live/E2E tests need a real
      # Incus daemon and are not run here — see #4 for wiring them into a
      # self-hosted runner.
      #
      # Two tests assume the filesystem won't reuse an inode across
      # unlink+recreate; GitHub runners reuse inodes, so those tests self-skip
      # when CI is set (see #6). Everything else runs normally.
      - name: Test
        run: make test

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
